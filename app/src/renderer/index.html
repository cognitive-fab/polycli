<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: polycli-view:; frame-src polycli-view:">
  <title>polycli</title>
  <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">polycli</div>
    <div class="topbar-title" id="topTitle"></div>
    <div class="topbar-right">
      <button class="inbox" id="billBtn" title="Time and tokens for this folder; click for monthly totals" hidden></button>
      <button class="inbox" id="helpBtn"title="Help">? Help</button>
      <button class="inbox" id="appSettingsBtn" title="polycli settings">⚙</button>
      <button class="inbox" id="themeBtn" title="Theme: System, Light or Dark">◐ System</button>
      <button class="inbox" id="keysBtn" title="Windows key variables and the workstreams that use them">Keys</button>
      <button class="inbox" id="inboxBtn" title="Sessions that need you"><span class="inbox-dot"></span><span id="inboxCount">0</span> need you</button>
      <div class="inbox-menu" id="inboxMenu" hidden></div>
    </div>
  </header>
  <div class="layout">
    <aside class="rail">
      <div class="rail-head">
        <span>Workstreams</span>
        <button class="icon-btn" id="addWs" title="New workstream">+</button>
      </div>
      <nav id="wsList"></nav>
    </aside>
    <main class="main">
      <div class="cowork-strip" id="coworkStrip" hidden></div>
      <div class="viewbar" id="viewbar" hidden>
        <button data-view="main" title="Claude sessions and shells">Main</button>
        <button data-view="board" title="Kanban board: Ready, Doing, Done; chat about a card and have Claude write its specs">Board</button>
        <button data-view="architecture" title="The archlens diagrams in architecture/ and docs/architecture/">Architecture</button>
        <button data-view="docs" title="The documents in docs/: preview and edit Markdown">Docs</button>
        <button data-view="tests" title="Run the project's test and check scripts and see the results">Tests</button>
        <span class="viewbar-gap"></span>
        <span class="layout-btns" role="group" aria-label="Panes">
          <button data-layout="1" title="One pane">▢</button>
          <button data-layout="2" title="Two panes side by side">◫</button>
          <button data-layout="4" title="Four panes">⊞</button>
        </span>
      </div>
      <div class="tabs" id="tabs"></div>
      <div class="panes" id="panes"></div>
      <div class="project" id="project" hidden></div>
      <div class="empty" id="empty" hidden></div>
    </main>
  </div>
  <div class="modal-back" id="modalBack" hidden><form class="modal" id="modal"></form></div>
  <div class="toast" id="toast" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
