<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:">
  <title>polycli</title>
  <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">polycli</div>
    <div class="topbar-title" id="topTitle"></div>
    <div class="topbar-right">
      <button class="inbox" id="keysBtn" title="Windows key variables and the workstreams that use them">Keys</button>
      <button class="inbox" id="inboxBtn" title="Sessions that need you"><span class="inbox-dot"></span><span id="inboxCount">0</span> need you</button>
      <div class="inbox-menu" id="inboxMenu" hidden></div>
    </div>
  </header>
  <div class="layout">
    <aside class="rail">
      <div class="rail-head">
        <span>Workstreams</span>
        <button class="icon-btn" id="addWs" title="New workstream">+</button>
      </div>
      <nav id="wsList"></nav>
    </aside>
    <main class="main">
      <div class="tabs" id="tabs"></div>
      <div class="panes" id="panes"></div>
      <div class="empty" id="empty" hidden></div>
    </main>
  </div>
  <div class="modal-back" id="modalBack" hidden><form class="modal" id="modal"></form></div>
  <div class="toast" id="toast" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
